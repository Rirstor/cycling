{% extends "base.html" %}
{% block content %}

<div id="status-bar">
    <article style="padding: 0.5rem 1rem;">
        <div class="control-bar">
            <span id="status-indicator"><span class="status-dot off" id="status-dot"></span><span id="status-text">Disconnected</span></span>
            <span id="connected-name" style="display:none; font-weight:bold; margin-left:0.5rem;"></span>
            <span id="record-indicator" style="display:none;"><span class="status-dot recording"></span><span class="recording-badge">REC</span></span>
            <span style="margin-left: auto;" id="elapsed-display">--:--</span>
        </div>
    </article>
</div>

<div id="device-list-view">
    <article>
        <header style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-weight:bold;">Available Devices</span>
            <span class="scanning-indicator" id="scan-indicator">
                Scanning
                <span class="dot"></span><span class="dot"></span><span class="dot"></span>
            </span>
        </header>
        <div id="device-list-empty">
            <p style="text-align:center; color:var(--pico-muted-color);">No BLE devices found yet. Scanning in progress...</p>
        </div>
        <div class="device-grid" id="device-grid"></div>
        <p id="device-count" style="font-size:0.85rem; color:var(--pico-muted-color);"></p>
    </article>
</div>

<div id="dashboard">
    <div id="routine-selector" class="routine-selector">
        <div class="routine-selector-header">Select Routine</div>
        <div class="routine-grid" id="routine-grid"></div>
        <button id="no-routine-btn" class="sec-btn" onclick="startNoRoutine()" style="margin-top:0.5rem;">Ride Freely</button>
    </div>

    <div id="routine-name-bar" class="routine-name-bar">
        <span id="routine-name-display"></span>
        <span id="routine-status-badge"></span>
    </div>

    <div class="timer-row">
        <div class="timer-box">
            <span class="timer-label">Segment</span>
            <span class="timer-value" id="segment-time">--:--</span>
        </div>
        <div class="timer-box">
            <span class="timer-label">Total</span>
            <span class="timer-value" id="total-time">00:00</span>
        </div>
    </div>

    <div class="power-row">
        <div class="metric-box" id="actual-power-box">
            <span class="metric-value" id="actual-power-val">--</span>
            <span class="metric-unit">Watts</span>
        </div>
        <div class="metric-box" id="target-power-box">
            <span class="metric-value" id="target-power-val">--</span>
            <span class="metric-unit">Target</span>
        </div>
        <div class="metric-box" id="speed-box">
            <span class="metric-value" id="speed-val">--</span>
            <span class="metric-unit">km/h</span>
        </div>
    </div>

    <div class="metrics-row">
        <div class="metric-box" id="cadence-box">
            <span class="metric-value" id="cadence-val">--</span>
            <span class="metric-unit">RPM</span>
        </div>
        <div class="metric-box" id="hr-box">
            <span class="metric-value" id="hr-val">--</span>
            <span class="metric-unit">BPM</span>
        </div>
    </div>

    <div class="chart-area" id="chart-area">
        <canvas id="workout-chart"></canvas>
        <div class="chart-zoom-controls">
            <button type="button" id="chart-zoom-in" aria-label="Zoom in">+</button>
            <button type="button" id="chart-zoom-out" aria-label="Zoom out">&minus;</button>
            <button type="button" id="chart-zoom-reset" aria-label="Reset zoom" style="width:auto;padding:0 10px;font-size:0.85rem;">Reset</button>
        </div>
    </div>

    <div class="action-bar">
        <button id="routine-play-btn" class="action-btn primary" onclick="toggleRoutinePlay()">&#9654; Play</button>
        <button id="routine-change-btn" class="action-btn" onclick="closeRoutine()">Change</button>
        <button id="record-btn" class="action-btn" onclick="toggleRecording()">&#9679; Rec</button>
        <button id="disconnect-btn" class="action-btn danger" onclick="disconnectTrainer()">X</button>
    </div>
</div>

<script>
let deviceSSE = null;
let liveSSE = null;
let connectedAddress = null;
let routines = [];
let selectedRoutine = null;
let routineActive = false;

let chartProfile = [];
let chartActuals = [];
let chartTotalDuration = 0;
let viewStart = 0;
let viewEnd = 0;
let chartDrawQueued = false;
const CHART_MIN_WINDOW = 30;

function chartFullDuration() {
    return chartTotalDuration > 0 ? chartTotalDuration : 600;
}
function clampView(s, e) {
    const full = chartFullDuration();
    let w = e - s;
    if (!(w >= CHART_MIN_WINDOW)) w = Math.min(CHART_MIN_WINDOW, full);
    if (w > full) w = full;
    if (s < 0) s = 0;
    if (s + w > full) s = full - w;
    if (s < 0) s = 0;
    return [s, s + w];
}
function setView(s, e) {
    const v = clampView(s, e);
    viewStart = v[0];
    viewEnd = v[1];
    requestDraw();
}
function resetView() {
    viewStart = 0;
    viewEnd = chartFullDuration();
    requestDraw();
}
function zoomAt(centerT, factor) {
    if (!(factor > 0)) return;
    const w = Math.min(Math.max((viewEnd - viewStart) * factor, CHART_MIN_WINDOW), chartFullDuration());
    const frac = (centerT - viewStart) / ((viewEnd - viewStart) || 1);
    const ns = centerT - w * Math.min(Math.max(frac, 0), 1);
    setView(ns, ns + w);
}
function panViewBySeconds(dt) {
    if (!dt) return;
    setView(viewStart + dt, viewEnd + dt);
}
function requestDraw() {
    if (chartDrawQueued) return;
    chartDrawQueued = true;
    requestAnimationFrame(function() {
        chartDrawQueued = false;
        drawChart();
    });
}

// Screen Wake Lock — held only while a routine is playing
let wakeLock = null;
async function requestWake() {
    try {
        if ('wakeLock' in navigator && !wakeLock) {
            wakeLock = await navigator.wakeLock.request('screen');
            if (wakeLock) {
                wakeLock.addEventListener('release', function() { wakeLock = null; });
            }
        }
    } catch (e) {}
}
async function releaseWake() {
    try {
        if (wakeLock) {
            await wakeLock.release();
            wakeLock = null;
        }
    } catch (e) { wakeLock = null; }
}
document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible') {
        const btn = document.getElementById('routine-play-btn');
        if (btn && btn.textContent.includes('Pause')) { requestWake(); }
    }
});

function startDeviceSSE() {
    if (deviceSSE) deviceSSE.close();
    deviceSSE = new EventSource('/events/devices');
    deviceSSE.onmessage = function(event) {
        const data = JSON.parse(event.data);
        if (data.type === 'devices') {
            updateDeviceList(data.devices || []);
        }
    };
    deviceSSE.onerror = function() {};
}

function updateDeviceList(devices) {
    const grid = document.getElementById('device-grid');
    const empty = document.getElementById('device-list-empty');
    const count = document.getElementById('device-count');
    grid.innerHTML = '';
    if (devices.length === 0) {
        empty.style.display = 'block';
        count.textContent = '';
        return;
    }
    empty.style.display = 'none';
    count.textContent = devices.length + ' device(s) found';
    devices.forEach(function(d) {
        const card = document.createElement('article');
        card.className = 'device-card';
        card.innerHTML = '<h3>' + (d.name || 'Unknown') + '</h3>' +
            '<p class="rssi">' + (d.rssi != null ? d.rssi + ' dBm' : 'RSSI: ?') + '</p>' +
            '<button class="connect-btn" data-address="' + d.address + '">Connect</button>';
        card.querySelector('.connect-btn').addEventListener('click', function(e) {
            e.stopPropagation();
            connectToDevice(d.address);
        });
        grid.appendChild(card);
    });
}

function connectToDevice(address) {
    connectedAddress = address;
    const formData = new FormData();
    formData.append('address', address);
    document.getElementById('status-text').textContent = 'Connecting...';
    document.getElementById('status-dot').className = 'status-dot off';
    fetch('/api/connect', { method: 'POST', body: formData })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (data.status === 'ok') {
                if (deviceSSE) { deviceSSE.close(); deviceSSE = null; }
                document.getElementById('device-list-view').style.display = 'none';
                document.getElementById('dashboard').classList.add('active');
                document.getElementById('status-text').textContent = 'Connected';
                document.getElementById('status-dot').className = 'status-dot on';
                loadRoutines();
                startLiveSSE();
                setTimeout(function() {
                    resetView();
                }, 50);
            } else {
                document.getElementById('status-text').textContent = 'Error: ' + data.message;
                document.getElementById('status-dot').className = 'status-dot off';
            }
        })
        .catch(function(err) {
            document.getElementById('status-text').textContent = 'Connection failed';
            document.getElementById('status-dot').className = 'status-dot off';
        });
}

function loadRoutines() {
    fetch('/api/routines')
        .then(function(r) { return r.json(); })
        .then(function(data) {
            routines = data.routines || [];
            renderRoutineGrid();
            document.getElementById('routine-selector').style.display = 'block';
        });
}

function selectRoutine(name) {
    selectedRoutine = routines.find(function(r) { return r.name === name; });
    if (!selectedRoutine) return;
    document.getElementById('routine-selector').style.display = 'none';
    document.getElementById('routine-name-bar').style.display = 'flex';
    document.getElementById('routine-name-display').textContent = selectedRoutine.name.replace(/_/g,' ');
    document.getElementById('routine-status-badge').textContent = 'Ready';

    fetch('/api/routine/preview/' + encodeURIComponent(name))
        .then(function(r) { return r.json(); })
        .then(function(data) {
            chartProfile = data.profile || [];
            chartTotalDuration = data.total_duration || 0;
            chartActuals = [];
            resetView();
        });
}

function startNoRoutine() {
    selectedRoutine = null;
    document.getElementById('routine-selector').style.display = 'none';
    document.getElementById('routine-name-bar').style.display = 'none';
    chartProfile = [];
    chartActuals = [];
    chartTotalDuration = 0;
    resetView();
}

function closeRoutine() {
    if (routineActive) {
        fetch('/api/routine/stop', { method: 'POST' });
        routineActive = false;
    }
    releaseWake();
    document.getElementById('routine-selector').style.display = 'block';
}

function toggleRoutinePlay() {
    if (!selectedRoutine) return;
    const btn = document.getElementById('routine-play-btn');
    if (btn.textContent.includes('Resume')) {
        fetch('/api/routine/resume', { method: 'POST' })
            .then(function(r) { return r.json(); }).then(function() {
                btn.innerHTML = '&#10074;&#10074; Pause';
                routineActive = true;
                document.getElementById('routine-status-badge').textContent = 'Active';
                requestWake();
            });
    } else if (btn.textContent.includes('Play')) {
        const formData = new FormData();
        formData.append('name', selectedRoutine.name);
        fetch('/api/routine/start', { method: 'POST', body: formData })
            .then(function(r) { return r.json(); }).then(function(data) {
            if (data.status === 'ok') {
                btn.innerHTML = '&#10074;&#10074; Pause';
                routineActive = true;
                document.getElementById('routine-status-badge').textContent = 'Active';
                requestWake();
                fetch('/api/routine/profile')
                    .then(function(r) { return r.json(); })
                    .then(function(data) {
                        chartProfile = data.profile || [];
                        chartTotalDuration = data.total_duration || 0;
                        chartActuals = data.actuals || [];
                        resetView();
                    });
            }
        });
    } else {
        fetch('/api/routine/pause', { method: 'POST' })
            .then(function(r) { return r.json(); }).then(function() {
                btn.innerHTML = '&#9654; Resume';
                document.getElementById('routine-status-badge').textContent = 'Paused';
                releaseWake();
            });
    }
}

function stopRoutine() {
    fetch('/api/routine/stop', { method: 'POST' });
    document.getElementById('routine-play-btn').innerHTML = '&#9654; Play';
    document.getElementById('routine-status-badge').textContent = 'Stopped';
    routineActive = false;
    releaseWake();
}

// Chart functions

function drawMiniRoutineChart(canvas, profile, duration) {
    if (!canvas || !profile || profile.length < 2) return;
    const w = canvas.parentElement.clientWidth || 200;
    const h = 55;
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    const pad = { top: 2, bottom: 10, left: 2, right: 2 };
    const plotW = w - pad.left - pad.right;
    const plotH = h - pad.top - pad.bottom;
    ctx.clearRect(0, 0, w, h);

    let maxPct = 10;
    for (let i = 0; i < profile.length; i++) if (profile[i][1] > maxPct) maxPct = profile[i][1];
    maxPct = Math.max(maxPct * 1.15, 50);

    function xOf(t) { return pad.left + (t / duration) * plotW; }
    function yOf(pct) { return pad.top + plotH - (pct / maxPct) * plotH; }

    // Fill under curve
    ctx.fillStyle = 'rgba(0, 204, 102, 0.08)';
    ctx.beginPath();
    for (let i = 0; i < profile.length; i++) {
        const x = xOf(profile[i][0]);
        const y = yOf(profile[i][1]);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.lineTo(xOf(duration), yOf(0));
    ctx.lineTo(xOf(0), yOf(0));
    ctx.closePath();
    ctx.fill();

    // Profile line
    ctx.strokeStyle = '#888';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (let i = 0; i < profile.length; i++) {
        const x = xOf(profile[i][0]);
        const y = yOf(profile[i][1]);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
}

function renderRoutineGrid() {
    const grid = document.getElementById('routine-grid');
    grid.innerHTML = '';
    routines.forEach(function(rt) {
        const mins = Math.floor(rt.duration_seconds / 60);
        const zoneColors = {1:'#0066cc',2:'#00cc66',3:'#ffcc00',4:'#ff8800',5:'#ff3300',6:'#cc00ff',7:'#ffffff'};
        const color = zoneColors[rt.target_zone] || '#888';
        const card = document.createElement('article');
        card.className = 'device-card';
        card.style.borderLeft = '4px solid ' + color;
        card.innerHTML = '<h3 style="margin-bottom:0.2rem;">' + rt.name.replace(/_/g,' ') + '</h3>' +
            '<canvas class="mini-routine-chart" data-profile=\'' + JSON.stringify(rt.profile || []) + '\' data-duration="' + rt.duration_seconds + '" style="width:100%; height:55px; border-radius:3px; margin:0.2rem 0;"></canvas>' +
            '<p style="font-size:0.85rem; color:var(--pico-muted-color);">' + rt.description.substring(0,80) + '...</p>' +
            '<p style="font-size:0.8rem;"><span style="color:' + color + ';">\u25cf</span> ' +
            rt.target_zone_name + ' &middot; ' + mins + ' min &middot; ' + rt.segment_count + ' segments</p>' +
            '<button class="primary" style="padding:0.2rem 0.8rem;" data-routine="' + rt.name + '">Select</button>';
        card.querySelector('button').addEventListener('click', function(e) {
            e.stopPropagation();
            selectRoutine(rt.name);
        });
        grid.appendChild(card);
    });
    // Draw mini charts after DOM update
    setTimeout(function() {
        document.querySelectorAll('.mini-routine-chart').forEach(function(canvas) {
            try {
                const profile = JSON.parse(canvas.dataset.profile);
                const duration = parseFloat(canvas.dataset.duration);
                drawMiniRoutineChart(canvas, profile, duration);
            } catch(e) {}
        });
    }, 50);
}

function disconnectTrainer() {
    releaseWake();
    fetch('/api/disconnect', { method: 'POST' })
        .then(function(r) { return r.json(); })
        .then(function() {
            if (liveSSE) { liveSSE.close(); liveSSE = null; }
            document.getElementById('dashboard').classList.remove('active');
            document.getElementById('device-list-view').style.display = 'block';
            document.getElementById('status-text').textContent = 'Disconnected';
            document.getElementById('status-dot').className = 'status-dot off';
            chartProfile = [];
            chartActuals = [];
            chartTotalDuration = 0;
            startDeviceSSE();
        });
}

function pad2(n) { return String(n).padStart(2, '0'); }

function formatDuration(seconds) {
    if (seconds == null || seconds < 0) return '--:--';
    return pad2(Math.floor(seconds / 60)) + ':' + pad2(Math.floor(seconds % 60));
}

function startLiveSSE() {
    if (liveSSE) liveSSE.close();
    liveSSE = new EventSource('/events/live');
    liveSSE.onmessage = function(event) {
        const data = JSON.parse(event.data);
        updateDashboard(data);
    };
    liveSSE.onerror = function() {};
}

function updateDashboard(data) {
    // Status
    const dot = document.getElementById('status-dot');
    const text = document.getElementById('status-text');
    if (dot) dot.className = 'status-dot ' + (data.connected ? 'on' : 'off');
    if (text) text.textContent = data.connected ? 'Connected' : 'Disconnected';

    // Elapsed time
    const mins = Math.floor((data.elapsed || 0) / 60);
    const secs = (data.elapsed || 0) % 60;
    const elapsedStr = String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
    const elapsedEl = document.getElementById('elapsed-display');
    if (elapsedEl) elapsedEl.textContent = elapsedStr;

    // Segment & total timers
    const remain = data.routine_active ? (data.segment_time_remaining || 0) : 0;
    const segEl = document.getElementById('segment-time');
    if (segEl) segEl.textContent = formatDuration(remain);
    const totalEl = document.getElementById('total-time');
    if (totalEl) totalEl.textContent = formatDuration(data.elapsed || 0);

    // Metrics: Actual Power (colored by 10% target deviation), Target, Speed, Cadence, HR
    const actualPowerEl = document.getElementById('actual-power-val');
    const targetPowerEl = document.getElementById('target-power-val');
    const speedEl = document.getElementById('speed-val');
    const cadEl = document.getElementById('cadence-val');
    const hrEl = document.getElementById('hr-val');

    // Actual Power — standalone value, colored green/red based on 10% target deviation
    if (data.power_watts != null && actualPowerEl) {
        actualPowerEl.textContent = data.power_watts.toFixed(0);
        if (data.routine_active && data.target_power != null && data.target_power > 0) {
            const devPct = Math.abs(data.power_watts - data.target_power) / data.target_power;
            actualPowerEl.className = 'metric-value ' + (devPct <= 0.10 ? 'on-target' : 'off-target');
        } else {
            actualPowerEl.className = 'metric-value';
        }
    } else if (actualPowerEl) {
        actualPowerEl.textContent = '--';
        actualPowerEl.className = 'metric-value';
    }

    // Target Power
    if (targetPowerEl) {
        targetPowerEl.textContent = (data.routine_active && data.target_power != null)
            ? data.target_power.toFixed(0) : '--';
    }

    // Speed (actual BLE speed, fallback to theoretical)
    if (speedEl) {
        const speed = data.speed_kph || data.theoretical_speed;
        speedEl.textContent = speed != null ? speed.toFixed(1) : '--';
    }

    // Cadence
    if (cadEl) cadEl.textContent = data.cadence_rpm != null ? data.cadence_rpm.toFixed(0) : '--';
    // Heart Rate
    if (hrEl) hrEl.textContent = data.heart_rate_bpm != null ? data.heart_rate_bpm.toFixed(0) : '--';

    // Recording button
    const recordBtn = document.getElementById('record-btn');
    if (recordBtn) {
        recordBtn.innerHTML = data.recording ? '&#9632; Stop' : '&#9679; Rec';
    }

    // Routine info bar
    const nameBar = document.getElementById('routine-name-bar');
    const playBtn = document.getElementById('routine-play-btn');
    const badge = document.getElementById('routine-status-badge');
    if (data.routine_active) {
        if (nameBar) nameBar.style.display = 'flex';
        const nameEl = document.getElementById('routine-name-display');
        if (nameEl) nameEl.textContent = data.routine_name || 'Workout';
        if (badge) {
            if (data.routine_status === 'playing') {
                badge.textContent = 'Active';
                if (playBtn) playBtn.innerHTML = '&#10074;&#10074; Pause';
                requestWake();
            } else if (data.routine_status === 'paused') {
                badge.textContent = 'Paused';
                if (playBtn) playBtn.innerHTML = '&#9654; Resume';
                releaseWake();
            } else if (data.routine_status === 'completed') {
                badge.textContent = 'Completed';
                if (playBtn) playBtn.innerHTML = '&#9654; Play';
                releaseWake();
            }
        }
    } else {
        if (nameBar) nameBar.style.display = 'none';
        if (playBtn) playBtn.innerHTML = '&#9654; Play';
        releaseWake();
    }

    if (data.routine_active && data.total_elapsed != null) {
        if (data.power_watts != null) {
            chartActuals.push([data.total_elapsed, data.power_watts]);
        }
        requestDraw();
    }
}

function getChartCanvas() {
    const canvas = document.getElementById('workout-chart');
    if (!canvas) return null;
    const container = document.getElementById('chart-area');
    if (!container) return null;
    const crect = container.getBoundingClientRect();
    if (crect.width === 0 || crect.height === 0) return null;
    const dpr = window.devicePixelRatio || 1;
    const pw = Math.round(crect.width * dpr);
    const ph = Math.round(crect.height * dpr);
    if (canvas.width !== pw || canvas.height !== ph || canvas._dpr !== dpr) {
        canvas.width = pw;
        canvas.height = ph;
        canvas.style.width = crect.width + 'px';
        canvas.style.height = crect.height + 'px';
        canvas._dpr = dpr;
    }
    return canvas;
}

// Clips a polyline to [tMin, tMax] by interpolating boundary crossing points.
// Handles both horizontal and vertical segments in the profile format.
function clipPolyline(points, tMin, tMax) {
    const result = [];
    for (let i = 0; i < points.length; i++) {
        const t = points[i][0], v = points[i][1];
        if (t < tMin) {
            if (i + 1 < points.length && points[i+1][0] >= tMin) {
                const nt = points[i+1][0], nv = points[i+1][1];
                if (nt > t) {
                    const frac = (tMin - t) / (nt - t);
                    result.push([tMin, v + frac * (nv - v)]);
                }
            }
            continue;
        }
        if (t > tMax) {
            if (result.length > 0 && i > 0) {
                const pt = points[i-1][0], pv = points[i-1][1];
                if (t > pt) {
                    const frac = (tMax - pt) / (t - pt);
                    result.push([tMax, pv + frac * (v - pv)]);
                }
            }
            break;
        }
        result.push([t, v]);
    }
    return result;
}

function chartTimeAtClientX(clientX) {
    const canvas = document.getElementById('workout-chart');
    if (!canvas) return (viewStart + viewEnd) / 2;
    const r = canvas.getBoundingClientRect();
    const padL = 50;
    const padR = 15;
    const plotW = Math.max(r.width - padL - padR, 1);
    const frac = Math.min(Math.max((clientX - r.left - padL) / plotW, 0), 1);
    return viewStart + frac * (viewEnd - viewStart);
}
function setupChartInteractions() {
    const canvas = document.getElementById('workout-chart');
    const area = document.getElementById('chart-area');
    if (!canvas || !area || canvas._interactionsBound) return;
    canvas._interactionsBound = true;
    const pointers = new Map();
    let panLastX = null;
    let pinchStartDist = 0;
    let pinchStartView = [0, 0];
    let pinchStartMid = 0;
    function plotSecondsPerPixel() {
        const r = canvas.getBoundingClientRect();
        const plotW = Math.max(r.width - 50 - 15, 1);
        return (viewEnd - viewStart) / plotW;
    }
    canvas.addEventListener('pointerdown', function(e) {
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (pointers.size === 1) {
            panLastX = e.clientX;
        } else if (pointers.size === 2) {
            const pts = Array.from(pointers.values());
            pinchStartDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
            pinchStartView = [viewStart, viewEnd];
            pinchStartMid = chartTimeAtClientX((pts[0].x + pts[1].x) / 2);
            panLastX = null;
        }
    });
    canvas.addEventListener('pointermove', function(e) {
        if (!pointers.has(e.pointerId)) return;
        const prev = pointers.get(e.pointerId);
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (pointers.size === 2) {
            const pts = Array.from(pointers.values());
            const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
            if (pinchStartDist > 0 && dist > 0) {
                const full = chartFullDuration();
                let w = (pinchStartView[1] - pinchStartView[0]) * (pinchStartDist / dist);
                w = Math.min(Math.max(w, CHART_MIN_WINDOW), full);
                const mid = chartTimeAtClientX((pts[0].x + pts[1].x) / 2);
                const anchor = pinchStartMid;
                const v = clampView(anchor - (anchor - pinchStartView[0]) * (w / ((pinchStartView[1] - pinchStartView[0]) || 1)), anchor - (anchor - pinchStartView[0]) * (w / ((pinchStartView[1] - pinchStartView[0]) || 1)) + w);
                viewStart = v[0];
                viewEnd = v[1];
                void mid;
                requestDraw();
            }
            return;
        }
        if (pointers.size === 1 && panLastX !== null) {
            const dx = e.clientX - panLastX;
            const dy = e.clientY - prev.y;
            if (Math.abs(dx) > Math.abs(dy) * 1.2 && Math.abs(dx) > 2) {
                panViewBySeconds(-dx * plotSecondsPerPixel());
                panLastX = e.clientX;
            } else if (Math.abs(dy) > 10) {
                panLastX = e.clientX;
            }
        }
    });
    function endPointer(e) {
        pointers.delete(e.pointerId);
        if (pointers.size < 2) pinchStartDist = 0;
        if (pointers.size === 0) {
            panLastX = null;
        } else if (pointers.size === 1) {
            const remaining = Array.from(pointers.values())[0];
            panLastX = remaining.x;
        }
    }
    canvas.addEventListener('pointerup', endPointer);
    canvas.addEventListener('pointercancel', endPointer);
    canvas.addEventListener('wheel', function(e) {
        if (!(e.ctrlKey || e.metaKey)) return;
        e.preventDefault();
        const center = chartTimeAtClientX(e.clientX);
        zoomAt(center, e.deltaY > 0 ? 1.15 : 0.87);
    }, { passive: false });
    canvas.addEventListener('dblclick', function() {
        resetView();
    });
    const zin = document.getElementById('chart-zoom-in');
    const zout = document.getElementById('chart-zoom-out');
    const zreset = document.getElementById('chart-zoom-reset');
    if (zin) zin.addEventListener('click', function(e) {
        e.stopPropagation();
        zoomAt((viewStart + viewEnd) / 2, 0.7);
    });
    if (zout) zout.addEventListener('click', function(e) {
        e.stopPropagation();
        zoomAt((viewStart + viewEnd) / 2, 1.4);
    });
    if (zreset) zreset.addEventListener('click', function(e) {
        e.stopPropagation();
        resetView();
    });
    if (typeof ResizeObserver !== 'undefined') {
        new ResizeObserver(function() { requestDraw(); }).observe(area);
    }
}
function drawChart() {
    const canvas = getChartCanvas();
    if (!canvas) return;
    if (!(viewEnd > viewStart)) {
        viewStart = 0;
        viewEnd = chartFullDuration();
    }
    const ctx = canvas.getContext('2d');
    const dpr = canvas._dpr || 1;
    const w = canvas.width / dpr;
    const h = canvas.height / dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const pad = { top: 10, bottom: 25, left: 50, right: 15 };
    const plotW = w - pad.left - pad.right;
    const plotH = h - pad.top - pad.bottom;

    ctx.clearRect(0, 0, w, h);

    function xToPixel(t) {
        return pad.left + ((t - viewStart) / (viewEnd - viewStart)) * plotW;
    }
    // Compute Y-axis max power from profile OR fallback to 300W
    let maxPower = 300;
    for (let i = 0; i < chartProfile.length; i++) {
        if (chartProfile[i][1] > maxPower) maxPower = chartProfile[i][1];
    }
    maxPower = Math.max(maxPower * 1.2, 50);
    function yToPixel(p) {
        return pad.top + plotH - (p / maxPower) * plotH;
    }

    // Draw grid (always visible)
    ctx.strokeStyle = '#2a2a3e';
    ctx.lineWidth = 1;
    const gridLines = 5;
    for (let i = 0; i <= gridLines; i++) {
        const y = pad.top + (i / gridLines) * plotH;
        ctx.beginPath();
        ctx.moveTo(pad.left, y);
        ctx.lineTo(w - pad.right, y);
        ctx.stroke();
    }
    for (let i = 0; i <= 10; i++) {
        const t = viewStart + (i / 10) * (viewEnd - viewStart);
        const x = xToPixel(t);
        ctx.beginPath();
        ctx.moveTo(x, pad.top);
        ctx.lineTo(x, pad.top + plotH);
        ctx.stroke();
    }

    if (chartProfile.length >= 2) {
        // Create clipped points for the tolerance band (upper and lower)
        const upper = chartProfile.map(function(pt) { return [pt[0], pt[1] * 1.1]; });
        const lower = chartProfile.map(function(pt) { return [pt[0], pt[1] * 0.9]; });
        const clippedUpper = clipPolyline(upper, viewStart, viewEnd);
        const clippedLower = clipPolyline(lower, viewStart, viewEnd);

        if (clippedUpper.length > 0 && clippedLower.length > 0) {
            ctx.save();
            ctx.beginPath();
            ctx.rect(pad.left, pad.top, plotW, plotH);
            ctx.clip();

            ctx.fillStyle = 'rgba(0, 204, 102, 0.08)';
            ctx.beginPath();
            // Upper boundary (left to right)
            for (let i = 0; i < clippedUpper.length; i++) {
                const xp = xToPixel(clippedUpper[i][0]);
                const yp = yToPixel(clippedUpper[i][1]);
                if (i === 0) ctx.moveTo(xp, yp);
                else ctx.lineTo(xp, yp);
            }
            // Lower boundary (right to left, reverse)
            for (let i = clippedLower.length - 1; i >= 0; i--) {
                const xp = xToPixel(clippedLower[i][0]);
                const yp = yToPixel(clippedLower[i][1]);
                ctx.lineTo(xp, yp);
            }
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }
    }

    // Draw target profile line with viewport-aware clipping
    if (chartProfile.length >= 2) {
        const clipped = clipPolyline(chartProfile, viewStart, viewEnd);
        if (clipped.length >= 2) {
            ctx.save();
            ctx.beginPath();
            ctx.rect(pad.left, pad.top, plotW, plotH);
            ctx.clip();

            ctx.strokeStyle = '#888';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let i = 0; i < clipped.length; i++) {
                const xp = xToPixel(clipped[i][0]);
                const yp = yToPixel(clipped[i][1]);
                if (i === 0) ctx.moveTo(xp, yp);
                else ctx.lineTo(xp, yp);
            }
            ctx.stroke();
            ctx.restore();
        }
    }

    // Draw actual data points and connecting line
    if (chartActuals.length > 0) {
        const clippedActuals = clipPolyline(chartActuals, viewStart, viewEnd);

        ctx.save();
        ctx.beginPath();
        ctx.rect(pad.left, pad.top, plotW, plotH);
        ctx.clip();

        // Connecting line for actuals
        if (clippedActuals.length >= 2) {
            ctx.strokeStyle = 'rgba(0, 204, 102, 0.4)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            for (let i = 0; i < clippedActuals.length; i++) {
                const xp = xToPixel(clippedActuals[i][0]);
                const yp = yToPixel(clippedActuals[i][1]);
                if (i === 0) ctx.moveTo(xp, yp);
                else ctx.lineTo(xp, yp);
            }
            ctx.stroke();
        }

        // Actual data dots with color based on target accuracy
        for (let i = 0; i < clippedActuals.length; i++) {
            const t = clippedActuals[i][0];
            const p = clippedActuals[i][1];
            const xp = xToPixel(t);
            const yp = yToPixel(p);

            let color = '#00cc66';
            let targetP = 0;
            for (let j = 0; j < chartProfile.length - 1; j++) {
                if (t >= chartProfile[j][0] && t <= chartProfile[j+1][0]) {
                    targetP = chartProfile[j][1];
                    break;
                }
            }
            if (targetP > 0 && Math.abs(p - targetP) / targetP > 0.10) {
                color = '#ff3333';
            }

            ctx.beginPath();
            ctx.arc(xp, yp, 3, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
        }

        // Current position cursor
        if (clippedActuals.length > 0) {
            const lastActual = clippedActuals[clippedActuals.length - 1];
            const cx = xToPixel(lastActual[0]);
            ctx.strokeStyle = 'rgba(255,255,255,0.5)';
            ctx.lineWidth = 1;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(cx, pad.top);
            ctx.lineTo(cx, pad.top + plotH);
            ctx.stroke();
            ctx.setLineDash([]);
        }
        ctx.restore();
    }

    // Axis X labels
    ctx.fillStyle = '#888';
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    for (let i = 0; i <= 6; i++) {
        const t = viewStart + (i / 6) * (viewEnd - viewStart);
        const x = xToPixel(t);
        const m = Math.floor(t / 60);
        const s = Math.floor(t % 60);
        ctx.fillText(m + ':' + String(s).padStart(2,'0'), x, h - 5);
    }
    // Axis Y labels
    ctx.textAlign = 'right';
    for (let i = 0; i <= 4; i++) {
        const pw = (i / 4) * maxPower;
        const y = yToPixel(pw);
        ctx.fillText(Math.round(pw) + 'W', pad.left - 5, y + 4);
    }
}



window.addEventListener('resize', requestDraw);
window.addEventListener('orientationchange', function() {
    setTimeout(requestDraw, 300);
});

document.addEventListener('DOMContentLoaded', function() {
    fetch('/api/status')
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (data.connected) {
                if (deviceSSE) { deviceSSE.close(); deviceSSE = null; }
                document.getElementById('device-list-view').style.display = 'none';
                document.getElementById('dashboard').classList.add('active');
                var name = data.device_name || 'Connected';
                var elapsed = formatDuration(data.elapsed || 0);
                document.getElementById('status-text').textContent = name + ' (' + elapsed + ')';
                document.getElementById('status-dot').className = 'status-dot on';
                document.getElementById('connected-name').style.display = 'inline';
                document.getElementById('connected-name').textContent = name;
                loadRoutines();
                startLiveSSE();
                var params = new URLSearchParams(window.location.search);
                var routineName = params.get('routine');
                if (routineName) {
                    setTimeout(function() { selectRoutine(routineName); }, 500);
                }
            }
        })
        .catch(function() {});
    setupChartInteractions();
    setTimeout(function() {
        resetView();
    }, 100);
});

function toggleRecording() {
    const btn = document.getElementById('record-btn');
    if (btn.textContent === 'Start Recording') {
        fetch('/api/record/start', { method: 'POST' })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.status !== 'ok') alert('Recording failed: ' + data.message);
            });
    } else {
        fetch('/api/record/stop', { method: 'POST' })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.status === 'ok') {
                    alert('Session #' + data.session_id + ' saved!');
                }
            });
    }
}

startDeviceSSE();
