<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cycling Dashboard</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <style>
        .device-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; margin: 1rem 0; }
        .device-card { text-align: center; cursor: pointer; transition: transform 0.1s; }
        .device-card:hover { transform: scale(1.02); }
        .device-card h3 { margin-bottom: 0.2rem; }
        .device-card .rssi { font-size: 0.85rem; color: var(--pico-muted-color); }
        .device-card .mini-routine-chart { width: 100%; height: 55px; border-radius: 3px; margin: 0.2rem 0; }
        .scanning-indicator { display: inline-flex; align-items: center; gap: 0.3rem; }
        .scanning-indicator .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--pico-color-green-500); animation: pulse 1s infinite; }
        .scanning-indicator .dot:nth-child(2) { animation-delay: 0.2s; }
        .scanning-indicator .dot:nth-child(3) { animation-delay: 0.4s; }
        .routines-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 1rem; margin: 1rem 0; }
        .routine-card { border-left: 4px solid var(--pico-primary); }
        .routine-card header { display: flex; justify-content: space-between; align-items: center; }
        .routine-card .meta { font-size: 0.85rem; color: var(--pico-muted-color); margin: 0.3rem 0; }
        .routine-card .desc { margin: 0.5rem 0; font-size: 0.9rem; }
        .routine-card canvas { width: 100%; height: 100px; border-radius: 4px; margin: 0.5rem 0; }
        .profile-chart-sm { width: 100%; height: 80px; border-radius: 4px; margin-top: 0.3rem; }
        .segment-list { font-size: 0.8rem; color: var(--pico-muted-color); margin-top: 0.3rem; }
        .segment-list details { margin: 0; }
        .segment-list summary { cursor: pointer; font-size: 0.85rem; }

        /* Responsive layout for phones */
        .metrics-chart-layout { display: grid; grid-template-columns: minmax(180px, 1.2fr) 2fr; gap: 1rem; margin-bottom: 1rem; }
        .metrics-column { display: flex; flex-direction: column; gap: 1rem; }
        .chart-column { min-height: 250px; }

        @media (max-width: 599px) and (orientation: portrait) {
            .device-grid   { grid-template-columns: 1fr; }
            .value-display { font-size: 1.8rem; }
            .metrics-chart-layout { grid-template-columns: 1fr; }
            #workout-chart { height: 140px !important; }
        }
        @media (max-height: 499px) and (orientation: landscape) {
            .value-display { font-size: 1.5rem; }
            .metrics-chart-layout { grid-template-columns: minmax(140px, 1fr) 2.5fr; }
            #workout-chart { height: 100px !important; }
        }

        /* Prevent scroll interference on chart canvas */
        #workout-chart { touch-action: none; }

        /* ── Mobile Dashboard Layout ── */
        body[data-dashboard-active="true"] nav { display: none; }
        body[data-dashboard-active="true"] main.container {
            padding-top: 0; padding-bottom: 0;
            max-width: 100%;
        }

        #dashboard { display: none; }
        #dashboard.active {
            display: flex; flex-direction: column; gap: 0.4rem;
            padding: 0.4rem; padding-bottom: 64px;
            height: calc(100dvh - 0.8rem);
            box-sizing: border-box;
        }
        .routine-selector {
            background: #1a1a2e; border-radius: 12px; padding: 1rem;
            margin-bottom: 0.5rem;
        }
        .routine-selector-header { font-weight: 700; margin-bottom: 0.5rem; }
        .routine-grid { display: grid; grid-template-columns: 1fr; gap: 0.5rem; }
        .routine-name-bar {
            display: none; justify-content: space-between; align-items: center;
            padding: 0.3rem 0.6rem; background: #1a1a2e; border-radius: 8px;
            font-size: 0.85rem; font-weight: 600;
        }

        /* Row 1: Timers */
        .timer-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem; }
        .timer-box {
            background: #1a1a2e; border-radius: 10px; padding: 0.5rem;
            text-align: center;
        }
        .timer-label { font-size: 0.65rem; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
        .timer-value { font-size: 1.8rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }

        /* Row 2: Power row — Actual Watts | Target Watts | Speed */
        .power-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.4rem; }
        .power-row .metric-box {
            background: #1a1a2e; border-radius: 10px; padding: 0.5rem;
            text-align: center;
        }
        .power-row .metric-value { font-size: 2rem; font-weight: 700; line-height: 1.2; }
        .power-row .metric-unit  { font-size: 0.7rem; color: #888; display: block; margin-top: 0.1rem; }

        /* Power color states — 10% target deviation threshold */
        .metric-value.on-target  { color: #00cc66; }
        .metric-value.off-target { color: #ff3333; }

        /* Row 3: Metrics (cadence, HR) */
        .metrics-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem; }
        .metric-box {
            background: #1a1a2e; border-radius: 10px; padding: 0.6rem;
            text-align: center;
        }
        .metric-value { font-size: 2rem; font-weight: 700; line-height: 1.2; }
        .metric-unit { font-size: 0.7rem; color: #888; display: block; margin-top: 0.1rem; }

        /* Row 4: Chart */
        .chart-area { flex: 1; min-height: 80px; background: #1a1a2e; border-radius: 10px; overflow: hidden; }
        #workout-chart { width: 100%; height: 100%; display: block; }

        /* Bottom: action bar */
        .action-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            display: flex; gap: 0.3rem; padding: 0.5rem;
            background: #0d0d1a; border-top: 1px solid #2a2a3e;
            z-index: 100;
        }
        .action-btn {
            flex: 1; font-size: 0.8rem; padding: 0.5rem 0.2rem;
            border-radius: 8px; border: none; font-weight: 600;
            background: #2a2a3e; color: #fff; cursor: pointer;
        }
        .action-btn.primary { background: #00cc66; color: #000; }
        .action-btn.danger   { background: #ff3333; color: #fff; }

        .routine-grid > :not(:first-child) { margin-top: 0.4rem; }
        .sec-btn {
            width: 100%; padding: 0.5rem; border-radius: 8px; border: none;
            background: #2a2a3e; color: #fff; font-size: 0.85rem; cursor: pointer;
        }

        /* ── Landscape ── */
        @media (orientation: landscape) {
            #dashboard.active {
                display: grid !important;
                grid-template-columns: 1fr 1fr;
                grid-template-rows: auto auto 1fr auto;
                gap: 0.4rem;
                padding: 0.4rem;
                height: calc(100dvh - 0.8rem);
                box-sizing: border-box;
            }
            .timer-row     { grid-column: 1; grid-row: 1; }
            .power-row     { grid-column: 1; grid-row: 2; }
            .metrics-row   { grid-column: 1; grid-row: 3; }
            .chart-area    { grid-column: 2; grid-row: 1 / 4; min-height: 0; }
            .action-bar    { grid-column: 1 / 3; grid-row: 4; position: static; }
            .routine-name-bar { grid-column: 1 / 3; }
        }
    </style>
</head>
<body>
    <nav class="container-fluid">
        <ul>
            <li><strong>Cycling Dashboard</strong></li>
        </ul>
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/live">Live</a></li>
            <li><a href="/routines">Routines</a></li>
            <li><a href="/history">History</a></li>
            <li><a href="/zones">Zones</a></li>
            <li><a href="/ftp">FTP</a></li>
        </ul>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/sw.js');
        }
    </script>
</body>
</html>
