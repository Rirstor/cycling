{% extends "base.html" %}
{% block content %}
<article>
    <hgroup>
        <h2>Training Zones</h2>
        <p>Based on FTP: <strong>{{ ftp }} W</strong></p>
    </hgroup>
    <table>
        <thead>
            <tr>
                <th>Zone</th>
                <th>Name</th>
                <th>Watts</th>
                <th>% FTP</th>
                <th>Description</th>
            </tr>
        </thead>
        <tbody>
            {% for z in zones.describe() %}
            <tr>
                <td>{{ z.zone }}</td>
                <td><strong>{{ z.name }}</strong></td>
                <td>{{ z.watt_range }}</td>
                <td>{{ z.pct_range }}</td>
                <td>{{ z.description }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</article>
{% endblock %}
