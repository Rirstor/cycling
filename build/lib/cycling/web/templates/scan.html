{% extends "base.html" %}
{% block content %}
<article>
    <hgroup>
        <h2>BLE Device Scan</h2>
        <p>Discover nearby cycling trainers and HR monitors</p>
    </hgroup>
    <form onsubmit="return startScan(event)">
        <div class="grid">
            <label>
                Scan duration (seconds)
                <input type="number" id="scan-timeout" value="10" min="3" max="60">
            </label>
            <div style="display:flex; align-items:flex-end;">
                <button type="submit" id="scan-btn">Scan</button>
            </div>
        </div>
    </form>
    <p id="scan-message"></p>
    <div id="scan-results" style="display:none;">
        <table>
            <thead>
                <tr><th>Name</th><th>Address</th><th>RSSI</th></tr>
            </thead>
            <tbody id="scan-tbody"></tbody>
        </table>
    </div>
</article>

<script>
function startScan(event) {
    event.preventDefault();
    const timeout = document.getElementById('scan-timeout').value;
    const btn = document.getElementById('scan-btn');
    const msg = document.getElementById('scan-message');
    const results = document.getElementById('scan-results');

    btn.disabled = true;
    btn.textContent = 'Scanning...';
    msg.textContent = 'Scanning for ' + timeout + 's...';
    msg.style.color = 'var(--pico-color-yellow-500)';
    results.style.display = 'none';

    const formData = new FormData();
    formData.append('timeout', timeout);

    fetch('/api/scan', { method: 'POST', body: formData })
        .then(r => r.json())
        .then(data => {
            btn.disabled = false;
            btn.textContent = 'Scan';
            if (data.status === 'ok') {
                const tbody = document.getElementById('scan-tbody');
                tbody.innerHTML = '';
                const devices = data.devices || [];
                if (devices.length === 0) {
                    msg.textContent = 'No devices found. Try a longer scan.';
                    msg.style.color = 'var(--pico-color-red-500)';
                } else {
                    msg.textContent = 'Found ' + devices.length + ' device(s):';
                    msg.style.color = 'var(--pico-color-green-500)';
                    devices.forEach(d => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = '<td>' + (d.name || 'Unknown') + '</td><td><code>' + d.address + '</code></td><td>' + d.rssi + '</td>';
                        tbody.appendChild(tr);
                    });
                    results.style.display = 'block';
                }
            } else {
                msg.textContent = 'Scan failed: ' + data.message;
                msg.style.color = 'var(--pico-color-red-500)';
            }
        })
        .catch(err => {
            btn.disabled = false;
            btn.textContent = 'Scan';
            msg.textContent = 'Error: ' + err;
            msg.style.color = 'var(--pico-color-red-500)';
        });
    return false;
}
</script>
{% endblock %}
