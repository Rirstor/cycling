image: python:3.11-slim

stages:
  - lint
  - test
  - build-python
  - build-apk
  - test-apk
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .pip-cache/
    - .gradle/
    - android/.gradle/
    - android/app/build/

# ─────────────────────────────────────────────
# Stage 1 — Lint
# ─────────────────────────────────────────────
lint:
  stage: lint
  script:
    - pip install ruff mypy types-requests
    - ruff check src/
    - mypy src/ --ignore-missing-imports --exclude "src/cycling/platform/"
  only:
    changes:
      - src/**/*.py

# ─────────────────────────────────────────────
# Stage 2 — Python unit tests
# ─────────────────────────────────────────────
pytest:
  stage: test
  script:
    - pip install -e ".[dev]"
    - pytest --junitxml=report-pytest.xml --cov=src/ --cov-report=term-missing
  artifacts:
    reports:
      junit: report-pytest.xml
    paths:
      - report-pytest.xml
  only:
    changes:
      - src/**/*.py
      - tests/**/*.py

pytest-platform-bridge:
  stage: test
  script:
    - pip install -e ".[dev]"
    - python -c "
        from cycling.ble import create_ble_client;
        client = create_ble_client();
        print(f'BLE factory OK: {type(client).__name__}')"
    - python -c "
        from cycling.platform.bridge import ble_data_queue, device_queue;
        print('Platform bridge OK')"
    - python -c "
        from cycling.web.server import app;
        assert any(r.path == '/health' for r in app.routes);
        print('/health endpoint OK')"

# ─────────────────────────────────────────────
# Stage 3 — Build Python wheel
# ─────────────────────────────────────────────
build-python:
  stage: build-python
  script:
    - pip install build
    - python -m build
  artifacts:
    paths:
      - dist/
  only:
    - main
    - tags

# ─────────────────────────────────────────────
# Stage 4 — Build Android APK
# ─────────────────────────────────────────────
build-apk:
  stage: build-apk
  image: ${CI_REGISTRY_IMAGE}/android-ci:latest
  before_script:
    - cd android
  script:
    - ./gradlew assembleDebug --stacktrace
  artifacts:
    paths:
      - android/app/build/outputs/
    expire_in: 30 days
  only:
    - main
    - tags

# ─────────────────────────────────────────────
# Stage 5 — Integration tests on Android emulator
# ─────────────────────────────────────────────
test-apk-emulator:
  stage: test-apk
  image: ${CI_REGISTRY_IMAGE}/android-ci:latest
  tags:
    - kvm
  services:
    - name: ${CI_REGISTRY_IMAGE}/android-emulator:latest
      alias: emulator
  before_script:
    - adb connect emulator:5555 || true
    - adb wait-for-device
    - adb install android/app/build/outputs/apk/debug/app-debug.apk
  script:
    - adb shell am start -n com.cycling.app/.MainActivity
    - sleep 8
    - adb logcat -d -s "PythonServer" | grep -q "Server ready"
    - echo "App launched successfully"
    - pip install appium-python-client
    - python tests/android/test_live_dashboard.py
  only:
    - main
  allow_failure: true

# ─────────────────────────────────────────────
# Stage 6 — Deploy APK
# ─────────────────────────────────────────────
deploy-apk:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      curl --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           --upload-file android/app/build/outputs/apk/debug/app-debug.apk \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/cycling-android/${CI_COMMIT_TAG}/app-debug.apk"
  artifacts:
    paths:
      - android/app/build/outputs/apk/debug/app-debug.apk
  only:
    - tags
