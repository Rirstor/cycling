[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cycling"
version = "0.1.0"
description = "Indoor cycling training app with BLE trainer support"
requires-python = ">=3.10"
dependencies = [
    "bleak>=3.0.0",
    "bleak-retry-connector>=4.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
web = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.18",
    "jinja2>=3.1.0",
]
android = [
    "chaquopy>=16.0.0",
]

[project.scripts]
cycling = "cycling.main:app"
cycling-web = "cycling.web.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cycling = ["web/templates/*", "web/static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = ["tests/android", "android"]
