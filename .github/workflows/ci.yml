name: Cycling CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main, master]
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install lint tools
        run: |
          pip install ruff mypy types-requests

      - name: Run ruff
        run: ruff check src/

      - name: Run mypy
        run: mypy src/ --ignore-missing-imports --exclude "src/cycling/platform/"

  test:
    name: Python unit tests
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: pip install -e ".[dev,web]"

      - name: Run pytest
        run: pytest --junitxml=report-pytest.xml --cov=src/ --cov-report=term-missing

      - name: Verify factory and bridge imports
        run: |
          python -c "from cycling.ble import create_ble_client; c = create_ble_client(); print(f'BLE factory: {type(c).__name__}')"
          python -c "from cycling.platform.bridge import ble_data_queue, device_queue; print('Platform bridge: OK')"
          python -c "from cycling.web.server import app; assert any(r.path == '/health' for r in app.routes); print('/health endpoint: OK')"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-report
          path: report-pytest.xml

  build-python:
    name: Build Python wheel
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel
        run: |
          pip install build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  build-apk:
    name: Build Android APK
    needs: [build-python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Accept Android licenses
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            || true

      - name: Copy Python source to Chaquopy source dir
        run: |
          mkdir -p android/app/src/main/python
          cp -r src/cycling android/app/src/main/python/

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  test-apk-emulator:
    name: Test APK on emulator
    needs: [build-apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
          path: apk/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant KVM permissions to runner
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            echo "KVM permissions granted"
          else
            echo "KVM not available on this runner"
          fi

      - name: Create and start emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          avd-name: CyclingTest
          force-avd-creation: false
          emulator-options: -no-window -no-audio -memory 2048
          disable-animations: true
          script: |
            # Wait for boot
            adb wait-for-device
            adb shell settings put global window_animation_scale 0.0
            adb shell settings put global transition_animation_scale 0.0
            adb shell settings put global animator_duration_scale 0.0

            # Install APK
            adb install apk/app-debug.apk

            # Launch app
            adb shell am start -n com.cycling.app/.MainActivity

            # Wait for Python server
            sleep 10

            # Verify app is running via logcat
            adb logcat -d -s PythonServer:I | head -20
            adb logcat -d -s "PythonServer" | grep -q "Server ready" && echo "Server started" || echo "Server check: $(adb logcat -d -s PythonServer:I 2>&1 | tail -5)"

            # Run Appium tests
            pip install --quiet appium-python-client
            python tests/android/test_live_dashboard.py

  deploy:
    name: Deploy APK to release
    needs: [build-apk]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
          path: .

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: app-debug.apk
          name: Cycling Android ${{ github.event.release.tag_name }}
          tag_name: ${{ github.event.release.tag_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
